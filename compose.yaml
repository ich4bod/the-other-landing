# Starting point for an application under /home/ichabod/apps/the-other-landing/.
# The resource limits are not suggestions: they are the only ceiling on this
# box that Docker enforces rather than Ichabod remembering.

name: the-other-landing

services:
  web:
    build: .
    restart: unless-stopped
    # No published host port. Traefik reaches the container over the proxy
    # network, so exposing one would only open a second, unrouted door.
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.the-other-landing.rule=Host(`the-other-landing.ichabod-crane.net`)"
      # Cloudflare serves HTTPS and the tunnel hands Traefik plain HTTP, so there is no certificate here.
      - traefik.http.routers.the-other-landing.entrypoints=web
      - traefik.http.services.the-other-landing.loadbalancer.server.port=80
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: ichabod-proxy
